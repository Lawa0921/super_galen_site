name: Caravan CI

on:
  pull_request:
    paths:
      - 'src/scripts/games/caravan/**'
      - 'src/pages/caravan/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/caravan-ci.yml'
  push:
    branches:
      - master
    paths:
      - 'src/scripts/games/caravan/**'
      - 'src/pages/caravan/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/caravan-ci.yml'

permissions:
  contents: read

concurrency:
  group: caravan-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-retention-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Run M38 adversarial tests
        run: >-
          npx vitest run
          src/scripts/games/caravan/data/retention.m38.test.ts
          src/scripts/games/caravan/data/retention.contractCosts.m38.test.ts
