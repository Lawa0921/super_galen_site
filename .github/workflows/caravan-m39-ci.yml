name: Caravan M39 CI

on:
  pull_request:
    paths:
      - 'src/scripts/games/caravan/**'
      - 'src/pages/caravan/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/caravan-m39-ci.yml'
  push:
    branches:
      - master
    paths:
      - 'src/scripts/games/caravan/**'
      - 'src/pages/caravan/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/caravan-m39-ci.yml'

permissions:
  contents: read

concurrency:
  group: caravan-m39-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-world-quest-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Run M39 adversarial tests
        run: npx vitest run src/scripts/games/caravan/data/ashenReliquary.m39.test.ts
