<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>原創 RTS 守衛｜模型檢視</title><link rel="stylesheet" href="./original-guard.css"></head><body><main class="review">
<header class="page-head"><div><p class="eyebrow">RTS · MODEL REVIEW</p><h1>原創守衛 <span>模型與動作檢視</span></h1></div><div class="status-chip" data-status>載入中</div></header>
<section class="workspace" aria-label="模型檢視工作區"><div class="stage-card"><div class="stage-topline"><div class="asset-title"><strong>Guard</strong><span data-asset-state>讀取候選資產…</span></div><div class="stage-meta"><span data-view-label>正面 · −Z</span><span class="divider"></span><span data-model-name>LOD 0</span></div></div>
<div class="stage-wrap"><canvas id="model-stage" aria-label="RTS 守衛 3D 模型"></canvas><div class="loading" data-loading>正在讀取 GLB 與材質…</div><div class="failure" data-failure hidden></div><div class="stage-caption"><span>Y-UP · FRONT −Z</span><span data-render-stats>等待 WebGL</span></div></div>
<div class="timeline"><div class="timeline-head"><strong data-action-label>待機</strong><span data-clock>0.00 / 2.40 秒</span></div><div class="scrub-wrap"><input data-scrubber aria-label="動作時間軸" type="range" min="0" max="2.4" step="0.001" value="0"><span class="contact-marker" data-contact-marker title="攻擊接觸點" aria-label="攻擊接觸時間"></span></div><div class="timeline-foot"><span data-contact-label>接觸標記：尚無動作資料</span><span class="transport"><button data-play aria-label="播放">▶ 播放</button><button data-pause aria-label="暫停">Ⅱ 暫停</button></span></div></div></div>
<aside class="controls"><section class="control-group"><h2>動作</h2><div class="action-grid"><button data-action="idle" class="selected">待機</button><button data-action="walk">行走</button><button data-action="attack">攻擊</button><button data-action="hurt">受擊</button><button data-action="death">死亡</button></div><p class="hint" data-motion-summary>動作時間與接觸點以 GLB／資產資料為準。</p></section>
<section class="control-group"><h2>視角</h2><div class="view-grid"><button data-view="front" class="selected">正面</button><button data-view="threequarter">斜前</button><button data-view="side">側面</button><button data-view="back">背面</button></div></section>
<section class="control-group split"><div><h2>隊伍色</h2><div class="segmented"><button data-team="blue" class="selected">藍隊</button><button data-team="red">紅隊</button></div></div><div><h2>模型細節</h2><div class="segmented"><button data-lod="0" class="selected">LOD 0</button><button data-lod="1">LOD 1</button></div></div></section>
<section class="asset-readout"><div><span>目前檔案</span><strong data-file-name>—</strong></div><div><span>SHA-256</span><code data-sha>計算中</code></div><div><span>網格／面數</span><strong data-geometry>—</strong></div><div><span>動作</span><strong data-clips>—</strong></div></section></aside></section>
<footer class="footnote"><span>使用 RTS 執行期 ModelInstance 與 team mask；未補正模型朝向或動作。</span><span data-runtime>Three.js · WebGL</span></footer></main><script type="module" src="./original-guard.js"></script></body></html>
